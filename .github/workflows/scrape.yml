name: جلب عروض مرجان وإرسالها لتلغرام

# متى يتم التشغيل
on:
  # تشغيل تلقائي كل 6 ساعات
  schedule:
    - cron: '0 */6 * * *'
  
  # تشغيل يدوي من خلال موقع GitHub
  workflow_dispatch:
  
  # تشغيل عند كل تعديل على الكود (للاختبار)
  push:
    branches: [ main ]
    paths:
      - 'marjan_scraper.py'
      - 'requirements.txt'

# المهام التي ستنفذ
jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    
    steps:
      # 1. تحميل الكود من المستودع
      - name: تحميل الكود
        uses: actions/checkout@v4
      
      # 2. إعداد بيئة بايثون
      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # 3. تثبيت المكتبات المطلوبة
      - name: تثبيت المتطلبات
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. تشغيل السكريبت
      - name: تشغيل سكريبت العروض
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python marjan_scraper.py
      
      # 5. حفظ قاعدة البيانات للمستقبل
      - name: حفظ قاعدة البيانات
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database
          path: deals.db
          retention-days: 30
